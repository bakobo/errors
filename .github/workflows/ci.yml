name: CI

# The package must import under the floor its consumers share, which is 3.14 across the stack:
# keripy requires ~=3.14.0 and heti and tefa both follow it (this.i @gjt4y3). The interpreter is
# named rather than left to the runner's default, which is older than the floor. Action versions are
# pinned to node24-runtime releases, verified 2026-08-06.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Run the suite at 100% branch coverage
        run: uv run --python 3.14 pytest
