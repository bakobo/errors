name: Pages

# Extracts every registry in the corpus, refuses to publish a collision, and deploys the catalog to
# errors.bakobo.com. Action versions are pinned to node24-runtime releases, verified 2026-08-06.
#
# The corpus repos are private, so the checkout steps need CORPUS_TOKEN — a fine-grained PAT with
# read access to the contents of every repo named in corpus.toml. Pull requests do not run this job:
# a fork's PR gets no secrets, and a PR here cannot change what another repo declares anyway. What
# can change it is a push in heti or tefa, which is why this also runs on a schedule — a collision
# minted elsewhere surfaces within a day rather than at the next push here.
#
# Adding a repo to corpus.toml means adding a checkout step below. Forgetting is not silent: the
# extractor stops with the repo named, rather than publishing a catalog missing its codes.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out heti
        uses: actions/checkout@v7
        with:
          repository: bakobo/heti
          path: checkouts/heti
          token: ${{ secrets.CORPUS_TOKEN }}
          persist-credentials: false

      - name: Check out tefa
        uses: actions/checkout@v7
        with:
          repository: bakobo/tefa
          path: checkouts/tefa
          token: ${{ secrets.CORPUS_TOKEN }}
          persist-credentials: false

      - name: Check out dev, whose standard the taxonomy data must match
        uses: actions/checkout@v7
        with:
          repository: bakobo/dev
          path: checkouts/dev
          token: ${{ secrets.CORPUS_TOKEN }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Refuse to publish a taxonomy that has drifted from the standard
        run: uv run bakobo-errors reconcile --standard checkouts/dev/standards/error-codes.md

      - name: Refuse to publish an unreadable registry or a collision
        run: uv run bakobo-errors check --checkouts checkouts

      - name: Generate a page for every code
        run: uv run bakobo-errors pages --checkouts checkouts

      - name: Render the site
        run: uv run zensical build --clean

      - name: Put our own 404 where a web server looks for it
        run: uv run bakobo-errors finalize

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
