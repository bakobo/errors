name: Pages

# Extracts every registry in the corpus, refuses to publish a collision, and deploys the catalog to
# errors.bakobo.com. Action versions are pinned to node24-runtime releases, verified 2026-08-06.
#
# The corpus repos are private and this one is public, so the checkouts below need a credential.
# It comes from the Bakobo Dependency Reader App, which mints a short-lived contents:read-only token
# scoped to named repos — the same instrument witness uses to fetch heti. A PAT would be a
# long-lived credential needing rotation forever; an App token expires on its own. client-id is a
# public identifier, not a credential; only the private key is secret.
#
# Pull requests do not run this job: a fork's PR gets no secrets, and a PR here cannot change what
# another repo declares anyway. What can change it is a push in heti or tefa, which is why this also
# runs on a schedule — a collision minted elsewhere surfaces within a day rather than at the next
# push here.
#
# Adding a repo to corpus.toml means adding a checkout step below (~4n6x — two edits for one
# fact). Forgetting is not silent: the extractor stops with the repo named, rather than publishing
# a catalog missing its codes.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Mint a token for the private repos the catalog reads
        id: corpus-reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: Iv23liAQRlNEpCyR1RXt
          private-key: ${{ secrets.DEP_READER_PRIVATE_KEY }}
          owner: bakobo
          repositories: |
            heti
            tefa
            dev

      # Isolates "the credential is broken" from "the catalog is broken", which the extractor alone
      # cannot distinguish — it would just report a missing checkout (this.i @ybxap2u7).
      #
      # IT RETRIES, because one read cannot distinguish those two either. On 2026-09-21 the first
      # read of bakobo/heti came back 404 six-tenths of a second after the token was minted and
      # turned the scheduled publish red; a manual re-run hours later passed all three repos with
      # nothing changed — heti unpushed since the 17th, the App still holding contents:read, and a
      # token naming a repo outside its installation would have failed to mint rather than reaching
      # this step. A single 404 here is therefore evidence of nothing.
      #
      # AND THE DISPOSITION IS COMPUTED, the same rule copilot-review-gate.yml follows: when the
      # retries are spent the token is asked what it is actually entitled to, which answers the
      # question a 404 cannot. Present in the token's own list and still unreadable is retryable;
      # absent from it is final and has a fix; a list that could not be read is neither, and says so.
      - name: Verify the token reaches every repo in the corpus
        env:
          TOKEN: ${{ steps.corpus-reader.outputs.token }}
        run: |
          set -uo pipefail

          # stdout only: git writes its diagnostics to stderr, and a probe that hides the reason for
          # the last failure would be reporting a verdict without its evidence.
          readable() {
            git ls-remote "https://x-access-token:${TOKEN}@github.com/bakobo/$1" HEAD > /dev/null
          }

          # The endpoint an installation token may ask about itself. Our token is scoped to the three
          # repos named above, so this lists exactly the grants the probe is testing.
          granted() {
            curl -sS --fail-with-body \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              'https://api.github.com/installation/repositories?per_page=100' \
              | jq -r '.repositories[].full_name'
          }

          for repo in heti tefa dev; do
            attempt=1
            until readable "$repo"; do
              if [ "$attempt" -ge 5 ]; then
                if ! entitled=$(granted); then
                  echo "::error::[e.env.corpus.unreadable.r] The App token cannot read bakobo/${repo}, and asking the token what it may read failed too (its error is above), so whether the grant is gone or GitHub is having a moment is unknown. This step will not guess; run it again, and if it keeps failing check the Bakobo Dependency Reader installation."
                  exit 1
                fi
                if ! printf '%s\n' "$entitled" | grep -qx "bakobo/${repo}"; then
                  echo "::error::[e.env.corpus.unreadable.f] The App token is not entitled to bakobo/${repo} — it is absent from the token's own repository list, which holds: ${entitled//$'\n'/, }. Retrying changes nothing. Add bakobo/${repo} to the Bakobo Dependency Reader installation, or drop it from corpus.toml and from the checkout steps below."
                  exit 1
                fi
                echo "::error::[e.env.corpus.unreadable.r] The App token is entitled to bakobo/${repo} and still could not read it after 5 attempts spread over ~20s (the read errors are above). The grant is intact, so this is GitHub rather than the installation; run it again."
                exit 1
              fi
              sleep "$((attempt * 2))"
              attempt=$((attempt + 1))
            done
          done

      - name: Check out heti
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bakobo/heti
          path: checkouts/heti
          token: ${{ steps.corpus-reader.outputs.token }}
          persist-credentials: false

      - name: Check out tefa
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bakobo/tefa
          path: checkouts/tefa
          token: ${{ steps.corpus-reader.outputs.token }}
          persist-credentials: false

      - name: Check out dev, whose standard the taxonomy data must match
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bakobo/dev
          path: checkouts/dev
          token: ${{ steps.corpus-reader.outputs.token }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Refuse to publish a taxonomy that has drifted from the standard
        run: uv run bakobo-errors reconcile --standard checkouts/dev/standards/error-codes.md

      - name: Refuse to publish an unreadable registry or a collision
        run: uv run bakobo-errors check --checkouts checkouts

      - name: Generate a page for every code
        run: uv run bakobo-errors pages --checkouts checkouts

      - name: Render the site
        run: uv run zensical build --clean

      - name: Put our own 404 where a web server looks for it
        run: uv run bakobo-errors finalize

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
