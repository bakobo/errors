# Hyphens that are one name rather than two levels.
#
# error-codes.md: a hyphen joins words into one name, a dot separates levels of meaning. The test is
# whether the left-hand thing could have a different problem — if it could, it is a level and the
# hyphen is a deleted one. That test needs a person, so every hyphen surviving in a Bakobo code is
# listed here with the reason it is one concept. An entry with no justification is refused, and an
# entry cannot excuse a hyphen the check has proven is a level — otherwise the escape hatch swallows
# the finding.
#
# This file's real job is not to permit things. It is to make hyphenating deliberate: nobody adds a
# line here without noticing they are adding it.
#
# Written 2026-08-06, against the corpus after the re-mint. Twelve entries were drafted by hand
# before the check ran and before the codes were read; nine of them were wrong. trans-aid and
# deleg-aid share `aid`, which can be unsupported in more than one way. duplicate-key, covered-comp
# and trusted-time are adjective-noun, so the noun is the subject and the hyphen was hiding it.
# time-addressing, malformed-answer, ambiguous-result and fold-disagrees each named a thing that
# turned out to have more than one possible problem once its title was read. Two survive.

"not-an-object" = "A phrase describing the value that arrived, in the sense of the JSON type it was not. There is no `not` for `an-object` to hang beneath."
"second-writer" = "A phrase naming who the other party was, under e.state.conflict.record. — not a writer whose problem is `second`."
