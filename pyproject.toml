[project]
name = "bakobo-errors"
version = "0.0.0"
description = "The shared Bakobo error-code machinery, and the catalog extracted from every registry."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Bakobo" }]
# No runtime dependencies, deliberately: heti and tefa import this on their error paths, and the
# extractor runs in CI. Everything it needs (ast, dataclasses, fnmatch, json) is in the stdlib.
dependencies = []

[project.scripts]
bakobo-errors = "bakobo.errors.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "zensical>=0.0.53",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bakobo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bakobo.errors --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["bakobo.errors"]
